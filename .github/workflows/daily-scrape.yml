name: Daily MakerWorld Scrape

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to scrape per category"
        required: false
        default: "100"
      page_size:
        description: "Models requested per page"
        required: false
        default: "20"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper without image analysis
        run: |
          python scraper.py \
            --no-image-analysis \
            --pages "${{ github.event.inputs.pages || '100' }}" \
            --page-size "${{ github.event.inputs.page_size || '20' }}"

      - name: Commit and push dated scrape outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/makerworld_models_*.csv data/makerworld_models_*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Add MakerWorld scrape for $(date -u +%F)"
          git push
