name: Daily MakerWorld Scrape

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to scrape per category"
        required: false
        default: "100"
      page_size:
        description: "Models requested per page"
        required: false
        default: "20"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper without image analysis
        run: |
          python scraper.py \
            --no-image-analysis \
            --pages "${{ github.event.inputs.pages || '100' }}" \
            --page-size "${{ github.event.inputs.page_size || '20' }}"

      - name: Upload dated scrape outputs
        uses: actions/upload-artifact@v4
        with:
          name: makerworld-data-${{ github.run_id }}
          path: data/makerworld_models_*.*
          retention-days: 90
